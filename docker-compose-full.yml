version: '3.8'

services:
  # PostgreSQL database for local development
  postgres:
    image: postgres:15-alpine
    container_name: leadflow-postgres
    environment:
      POSTGRES_DB: leadflow_dev
      POSTGRES_USER: leadflow
      POSTGRES_PASSWORD: dev_password_123
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadflow -d leadflow_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - leadflow-network

  # Redis for caching and Dapr state store
  redis:
    image: redis:7-alpine
    container_name: leadflow-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - leadflow-network

  # Redpanda (Kafka-compatible) for event streaming
  redpanda:
    image: redpandadata/redpanda:latest
    container_name: leadflow-redpanda
    command:
      - redpanda start
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
      - --pandaproxy-addr 0.0.0.0:8082
      - --advertise-pandaproxy-addr localhost:8082
      - --rpc-addr 0.0.0.0:33145
      - --advertise-rpc-addr redpanda:33145
      - --smp 1
      - --memory 1G
      - --mode dev-container
      - --default-log-level=info
    ports:
      - "9092:9092"     # Kafka API
      - "8082:8082"     # Pandaproxy (REST API)
      - "9644:9644"     # Admin API
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s
    networks:
      - leadflow-network

  # Redpanda Console (UI for Kafka topics, messages)
  redpanda-console:
    image: redpandadata/console:latest
    container_name: leadflow-redpanda-console
    depends_on:
      - redpanda
    environment:
      KAFKA_BROKERS: redpanda:29092
    ports:
      - "8080:8080"
    networks:
      - leadflow-network

  # Backend API service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: leadflow-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    environment:
      - NODE_ENV=development
      - PORT=3005
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=leadflow_dev
      - DATABASE_USER=leadflow
      - DATABASE_PASSWORD=dev_password_123
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BROKERS=redpanda:29092
      - DAPR_HOST=redpanda
      - DAPR_HTTP_PORT=3500
      - JWT_SECRET=your-jwt-secret-key-change-in-production
      - JWT_ISSUER=https://cognito-idp.us-east-1.amazonaws.com/your-user-pool-id
      - JWT_AUDIENCE=your-client-id
      - COGNITO_USER_POOL_ID=us-east-1_xxxxxxxxx
      - COGNITO_REGION=us-east-1
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-sk-ant-api-key-placeholder}
      - ANTHROPIC_MODEL=claude-3-sonnet-20240229
      - ANTHROPIC_MAX_TOKENS=1024
      - ANTHROPIC_TEMPERATURE=0.7
      - ENABLE_AI_QUALIFICATION=${ENABLE_AI_QUALIFICATION:-false}
      - LOG_LEVEL=info
      - CORS_ORIGIN=http://localhost:3001
      - ENCRYPTION_KEY=your-encryption-key-for-pii-fields
    ports:
      - "3005:3005"
    volumes:
      - ./backend/src:/app/src
      - ./backend/package.json:/app/package.json
    networks:
      - leadflow-network
    restart: unless-stopped

  # Frontend service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_BASE_URL=http://localhost:3005
        - NEXT_PUBLIC_API_VERSION=v1
        - BETTER_AUTH_SECRET=5500a14a162c9c84f72126364eb4563eeac3819d85ae0b49c55b54bb8385e9f7
        - BETTER_AUTH_URL=http://localhost:3001
        - NEXT_PUBLIC_BETTER_AUTH_URL=http://localhost:3001
    container_name: leadflow-frontend
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://backend:3005
      - NEXT_PUBLIC_API_VERSION=v1
      - NODE_ENV=development
    ports:
      - "3001:3001"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - leadflow-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  redpanda_data:
    driver: local

networks:
  leadflow-network:
    driver: bridge