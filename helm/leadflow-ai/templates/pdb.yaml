{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "leadflow-ai.fullname" . }}-backend
  labels:
    {{- include "leadflow-ai.backend.labels" . | nindent 4 }}
spec:
  {{- if .Values.podDisruptionBudget.minAvailable }}
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "leadflow-ai.backend.selectorLabels" . | nindent 6 }}
{{- end }}
