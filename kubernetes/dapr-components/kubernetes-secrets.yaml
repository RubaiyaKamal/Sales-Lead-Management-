apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: kubernetes-secrets
  namespace: leadflow-ai
spec:
  type: secretstores.kubernetes
  version: v1
  metadata:
    []
    # No additional metadata required for Kubernetes secret store
    # This component automatically accesses Kubernetes Secrets in the same namespace

# Usage:
# Applications can reference secrets using Dapr Secret Store API
# Example: daprClient.secret.get("kubernetes-secrets", "leadflow-database-secret", "DATABASE_URL")
#
# Referenced secrets:
# - leadflow-database-secret: DATABASE_URL (Neon DB connection string)
# - leadflow-jwt-secret: JWT_SECRET (JWT signing key)
# - leadflow-anthropic-secret: ANTHROPIC_API_KEY (Claude API key)
# - leadflow-sendgrid-secret: SENDGRID_API_KEY (Email API key)
# - leadflow-twilio-secret: TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN (WhatsApp API)
# - leadflow-redis-secret: password (Redis auth)
# - leadflow-kafka-secret: saslUsername, saslPassword, caCert (Kafka auth)

---
apiVersion: v1
kind: Secret
metadata:
  name: leadflow-database-secret
  namespace: leadflow-ai
type: Opaque
stringData:
  DATABASE_URL: ""  # postgresql://user:password@host:5432/database?sslmode=require
  # Set via: kubectl create secret generic leadflow-database-secret --from-literal=DATABASE_URL="..."

---
apiVersion: v1
kind: Secret
metadata:
  name: leadflow-jwt-secret
  namespace: leadflow-ai
type: Opaque
stringData:
  JWT_SECRET: ""  # Strong random string (e.g., openssl rand -base64 32)
  # Set via: kubectl create secret generic leadflow-jwt-secret --from-literal=JWT_SECRET="..."

---
apiVersion: v1
kind: Secret
metadata:
  name: leadflow-anthropic-secret
  namespace: leadflow-ai
type: Opaque
stringData:
  ANTHROPIC_API_KEY: ""  # Claude API key from Anthropic console
  # Set via: kubectl create secret generic leadflow-anthropic-secret --from-literal=ANTHROPIC_API_KEY="sk-ant-..."

---
apiVersion: v1
kind: Secret
metadata:
  name: leadflow-sendgrid-secret
  namespace: leadflow-ai
type: Opaque
stringData:
  SENDGRID_API_KEY: ""  # SendGrid API key
  # Set via: kubectl create secret generic leadflow-sendgrid-secret --from-literal=SENDGRID_API_KEY="SG...."

---
apiVersion: v1
kind: Secret
metadata:
  name: leadflow-twilio-secret
  namespace: leadflow-ai
type: Opaque
stringData:
  TWILIO_ACCOUNT_SID: ""
  TWILIO_AUTH_TOKEN: ""
  TWILIO_WHATSAPP_NUMBER: ""  # e.g., whatsapp:+14155238886
  # Set via: kubectl create secret generic leadflow-twilio-secret --from-literal=TWILIO_ACCOUNT_SID="..." --from-literal=TWILIO_AUTH_TOKEN="..."

---
apiVersion: v1
kind: Secret
metadata:
  name: leadflow-redis-secret
  namespace: leadflow-ai
type: Opaque
stringData:
  password: ""  # Leave empty for local dev, set for managed Redis
  # Set via: kubectl create secret generic leadflow-redis-secret --from-literal=password="..."

---
apiVersion: v1
kind: Secret
metadata:
  name: leadflow-kafka-secret
  namespace: leadflow-ai
type: Opaque
stringData:
  authType: "none"  # "none" for local, "sasl" for production Redpanda Cloud
  saslUsername: ""
  saslPassword: ""
  caCert: ""  # TLS CA certificate for production
  # Set via: kubectl create secret generic leadflow-kafka-secret --from-literal=authType="sasl" --from-literal=saslUsername="..." --from-literal=saslPassword="..."
